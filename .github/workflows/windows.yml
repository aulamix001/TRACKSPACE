name: Windows x64 VST3
on:
  workflow_dispatch:
  push:
    branches: [main, work]
  pull_request:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/Build-Windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: TRACKSPACE-Windows-x64
          path: dist/TRACKSPACE-Windows-x64.zip
          if-no-files-found: error
